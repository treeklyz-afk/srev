name: Mobile Linux Web

on:
  workflow_dispatch:

jobs:
  web-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Setup Web Terminal and Tunnel
        run: |
          # 1. Install ttyd (Web Terminal)
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttyd

          # 2. Download Cloudflare Tunnel (fast & reliable)
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # 3. Start web terminal in background
          ttyd -p 7681 bash &

          # 4. Start Cloudflare Tunnel
          ./cloudflared tunnel --url http://127.0.0.1:7681 > tunnel.log 2>&1 &
          
          # 5. Wait for link to generate
          sleep 5
          URL=$(grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log | head -n 1)

          echo ""
          echo "=========================================================="
          echo "DASHBOARD WEB LINK: $URL"
          echo "=========================================================="
          echo ""

          echo "## 🚀 Linux Web Dashboard Ready" >> $GITHUB_STEP_SUMMARY
          echo "Aapka link: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY

      - name: 2. Active Session
        run: |
          echo "Session running. Kaam khatam hone par Cancel dabayein."
          sleep 7200
